<style>
:root{
  --bg:#FAFAF9; --card:#FFFFFF; --ink:#1A1A18; --sub:#615E58; --muted:#98948C;
  --line:#E6E3DC; --line2:#F0EEE8; --accent:#2E3F54; --accent-soft:#EDF0F4;
  --good:#3F6B4F; --warn:#8A6A2F;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#151513;--card:#1D1D1A;--ink:#EDEBE5;--sub:#A8A49B;--muted:#7B7770;
        --line:#2C2B27;--line2:#232320;--accent:#9FB6D0;--accent-soft:#232A33;--good:#82A88F;--warn:#C0A163;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Source Han Serif SC",serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
select{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;flex:1}
input,textarea{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical}

/* layout */
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.sidebar{display:none}
main{min-height:60vh}

/* nav */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{padding:9px 0 8px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .g{width:20px;height:20px;display:block}
.tabbar button[aria-current="page"]{color:var(--ink)}

/* head */
.head{padding:14px 2px 20px}
.greet{font-size:13px;color:var(--muted);letter-spacing:.01em}
.date{font-size:30px;line-height:1.15;margin-top:2px;letter-spacing:-.01em}
.status{margin-top:8px;font-size:13.5px;color:var(--sub)}
.status b{font-weight:600;color:var(--ink)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.flat{background:transparent;border-style:dashed}
.ctitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ctitle h2{font-size:16px;letter-spacing:-.01em}
.ctitle .aside{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.sep{height:1px;background:var(--line2);margin:12px 0}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line2);padding:4px;border-radius:11px}
.seg button{padding:8px 0;border-radius:8px;font-size:13.5px;color:var(--sub);text-align:center}
.seg button[data-on="1"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}

/* tasks */
.group{margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.task{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:none}
.box{flex:0 0 19px;width:19px;height:19px;margin-top:2px;border:1.4px solid var(--line);border-radius:6px;display:grid;place-items:center}
.box svg{width:12px;height:12px;opacity:0;stroke:var(--card)}
.task[data-done="1"] .box{background:var(--ink);border-color:var(--ink)}
.task[data-done="1"] .box svg{opacity:1}
.task[data-done="1"] .tl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tbody{flex:1;min-width:0}
.tl{font-size:14.5px;line-height:1.4}
.tn{font-size:12.5px;color:var(--muted);margin-top:2px}
.opt{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.del{color:var(--muted);font-size:13px;padding:2px 6px}

/* classes */
.cls{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2)}
.cls:last-child{border-bottom:none}
.cls .t{flex:0 0 92px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.cls .n{font-size:14.5px}
.cls .n small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

/* skeleton */
.sk{display:flex;gap:12px;padding:7px 0}
.sk .k{flex:0 0 92px;font-size:12.5px;color:var(--muted)}
.sk .v{flex:1;font-size:14px}
.sk .v small{display:block;color:var(--muted);font-size:12.5px}
.blank{display:flex;align-items:baseline;justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:10px}
.blank .num{font-size:22px;letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* bars */
.bar{height:4px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .35s ease}
.bar.accent i{background:var(--accent)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.row .lab{font-size:14px}
.row .val{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.stack>*+*{margin-top:14px}

/* chips / buttons */
.btn{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13.5px;color:var(--ink);background:var(--card)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.quiet{border-color:transparent;color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
button.pill{font-size:13px;padding:6px 12px}

/* toggle */
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.tg:last-child{border-bottom:none}
.tg .tt{font-size:14.5px}
.tg .td{font-size:12.5px;color:var(--muted);margin-top:2px}
.sw{flex:0 0 46px;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:var(--card);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw[data-on="1"]{background:var(--accent)}
.sw[data-on="1"]::after{transform:translateX(18px)}

/* week */
.day{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.day .dw{font-size:15px;font-weight:600}
.day .dd{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .dl{font-size:13px;color:var(--sub);margin-top:5px}
.day .df{font-size:12.5px;color:var(--muted);margin-top:4px}
.day[data-today="1"]{border-color:var(--ink)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0}
.cell{aspect-ratio:1/1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);border:1px solid transparent}
.cell.out{color:var(--line)}
.cell[data-today="1"]{border-color:var(--ink)}
.cell[data-sel="1"]{background:var(--accent-soft)}
.dot{width:4px;height:4px;border-radius:99px;background:var(--muted)}
.dot.class{background:var(--ink)}
.dot.special{background:var(--accent)}
.dot.exam{background:var(--warn)}
.dot.off{background:var(--line)}
.dot.ev{background:var(--good)}
.cell{gap:2px}
.scrollist{max-height:336px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
.morebtn{margin-top:10px;width:100%;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:flex;align-items:center;gap:5px}

/* lesson grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;margin-top:12px}
.lz{aspect-ratio:1/1;border:1px solid var(--line);border-radius:6px;font-size:10.5px;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.lz[data-done="1"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.notice{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:11px;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
.tl-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2)}
.tl-item:last-child{border-bottom:none}
.tl-item .w{flex:0 0 140px;font-size:12.5px;color:var(--muted)}
.tl-item .b{flex:1;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 0;border-bottom:1px solid var(--line2)}
td:last-child{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}

@media (min-width:900px){
  body{display:flex}
  .sidebar{display:block;position:sticky;top:0;height:100vh;flex:0 0 232px;border-right:1px solid var(--line);padding:28px 18px}
  .sidebar .brand{font-size:17px;margin-bottom:22px;padding-left:10px}

  .tabbar{display:none}
  .wrap{padding:26px 34px 60px;max-width:860px}
  .head{padding-top:6px}
}

function nextLesson(offset){
  var skip=offset||0;
  for(var i=0;i<LEVELS.length;i++){
    var L=LEVELS[i],done=state.korean[L.id];
    if(done+skip<L.total)return{level:L,num:done+skip+1};

/* 语言安排：韩语每天，英语 4–5 天，德语 2–3 天 */
function langPlan(k){
  var wd=pd(k).getDay(), ld=classLoad(k), off=!!offOf(k);
  var en=false,de=false;
  if(wd===0)return{en:false,de:false};              /* 周日只做复习 */
  if(wd===3){en=false;de=true;}                      /* 周三：韩 + 德 */
  else if(wd===6){en=true;de=true;}                  /* 周六：韩 + 英（德语可选） */
  else if(ld===2){en=false;de=false;}                /* 重课日：只主推韩语 */
  else{en=true;de=false;}
  if(off&&!en&&wd!==0)en=true;                       /* 没课的工作日补上英语 */
  return{en:en,de:de};
}

function syncTasks(k){
  var d=state.days[k];if(!d)return;
  var tpl=templateFor(k,d.mode),old={},out=[];
  (d.tasks||[]).forEach(function(t){old[t.id]=t;});
  tpl.forEach(function(t){
    var o=old[t.id],x={id:t.id,g:t.g,l:t.l,n:t.n,o:t.o,done:o?!!o.done:false};
    if(o&&o.meta)x.meta=o.meta;if(o&&o.custom)x.custom=true;out.push(x);
  });
  var ids={};out.forEach(function(t){ids[t.id]=1;});
  (d.tasks||[]).forEach(function(t){if(!ids[t.id]&&(t.custom||t.done))out.push(t);});
  d.tasks=out;
}
function taskLabel(t){
  if(t.l==="__KR1__")return t.meta?t.meta.label:krLabel(0);

function weekDays(k){var s=weekStart(pd(k)),out=[];for(var i=0;i<7;i++)out.push(dk(addDays(s,i)));return out;}
function moviesThisWeek(k){var ks=weekDays(k),n=0;state.movies.forEach(function(m){if(ks.indexOf(m.date)>=0)n++;});return n;}
function dayDone(k){var d=state.days[k];if(!d||!d.tasks)return null;
  var req=d.tasks.filter(function(t){return !t.o;});
  return{done:req.filter(function(t){return t.done;}).length,total:req.length,
         all:d.tasks.filter(function(t){return t.done;}).length};}
function weekStats(k){
  var ks=weekDays(k),st={kr:0,en:0,de:0,read:0,mov:0,done:0,total:0,byGroupDone:{},byGroupMiss:{},logged:0};
  ks.forEach(function(key){
    var d=state.days[key];if(!d)return;
    st.kr+=d.krLessons||0;st.read+=d.reading||0;
    var hasEn=false,hasDe=false,any=false;
    (d.tasks||[]).forEach(function(t){
      if(!t.o){st.total++;if(t.done)st.done++;}
      if(t.done){any=true;st.byGroupDone[t.g]=(st.byGroupDone[t.g]||0)+1;
        if(t.g==="English")hasEn=true;if(t.g==="German")hasDe=true;}
      else st.byGroupMiss[t.g]=(st.byGroupMiss[t.g]||0)+1;
    });
    if((d.vocab||0)>0)hasEn=true;
    if(hasEn)st.en++;if(hasDe)st.de++;if(any||d.reading||d.vocab)st.logged++;
  });
  st.mov=moviesThisWeek(k);
  return st;
}
function recentRate(){
  var tot=0,wk=0;
  for(var i=0;i<4;i++){
    var ks=weekDays(dk(addDays(pd(todayKey()),-7*i))),any=false,sum=0;
    ks.forEach(function(x){var d=state.days[x];if(!d)return;sum+=d.krLessons||0;
      if((d.krLessons||0)||(d.reading||0)||(d.vocab||0)||(d.tasks||[]).some(function(t){return t.done;}))any=true;});
    if(any){tot+=sum;wk++;}
  }
  return wk?tot/wk:null;
}
function projectTo(rate,toKey){
  var wks=Math.max(0,daysBetween(todayKey(),toKey)/7),tot=0;
  LEVELS.forEach(function(L){tot+=state.korean[L.id];});
  var n=Math.round(tot+rate*wks),acc=0;
  for(var i=0;i<LEVELS.length;i++){
    if(n<=acc+LEVELS[i].total)return LEVELS[i].name+" 第 "+Math.max(1,n-acc)+" 课";
    acc+=LEVELS[i].total;
  }
  return "课程全部上完";
}

function statusLine(k,sem,cls,st){
  var bits=[];

function sleepAdvice(ft){

  var cm=state.ui.calMonth||state.ui.date.slice(0,7);
  var y=+cm.slice(0,4),m=+cm.slice(5,7);
  var first=new Date(y,m-1,1),start=weekStart(first),html="";
  html+='<div class="head"><div class="greet">日历</div><h1 class="date serif">'+y+' 年 '+m+' 月</h1>'+
    '<div class="btns" style="margin-top:12px"><button class="btn" data-act="mon" data-n="-1">上个月</button>'+
    '<button class="btn" data-act="mon" data-n="0">本月</button>'+
    '<button class="btn" data-act="mon" data-n="1">下个月</button></div></div>';
  html+='<div class="card"><div class="cal">';
  ["一","二","三","四","五","六","日"].forEach(function(w){html+='<div class="wd">'+w+'</div>';});
  for(var i=0;i<42;i++){
    var d=addDays(start,i),k=dk(d),out=(d.getMonth()+1)!==m;
    if(i>=35&&out)break;
    var c=classesOf(k),mk=MARKS[k],offt=offOf(k),dot="";
    var hasEv=(state.events||[]).some(function(ev){return occAfter(ev,k)===k;});
    if(MAKEUP[k])dot='<span class="dot special"></span>';
    else if(mk&&/考试|停课/.test(mk))dot='<span class="dot exam"></span>';
    else if(c.list.length)dot='<span class="dot class"></span>';
    else if(offt)dot='<span class="dot off"></span>';
    html+='<button class="cell'+(out?" out":"")+'" data-act="openDay" data-k="'+k+'" data-today="'+(k===todayKey()?1:0)+'" data-sel="'+(k===state.ui.date?1:0)+'">'+
      d.getDate()+dot+(hasEv?'<span class="dot ev"></span>':"")+'</button>';
  }
  html+='</div><div class="legend"><span><i class="dot class"></i>上课</span><span><i class="dot special"></i>补课</span>'+
    '<span><i class="dot exam"></i>考试 / 停课</span><span><i class="dot off"></i>假期</span><span><i class="dot ev"></i>日程</span></div></div>';

  /* selected day detail */
  var k=state.ui.date,c=classesOf(k),D=pd(k);
  html+='<div class="card"><div class="ctitle"><h2>'+fmtDate(D)+' '+WD[D.getDay()]+'</h2>'+
    '<button class="btn quiet" data-act="openDayTab" data-k="'+k+'">打开这天</button></div>';
  if(MARKS[k])html+='<div class="hint" style="margin-bottom:10px">'+esc(MARKS[k])+'</div>';
  if(c.list.length)c.list.forEach(function(x){var mm2=meta(x[1]);
    html+='<div class="cls"><div class="t">'+esc(x[0])+'</div><div class="n">'+esc(x[1])+
      (mm2?'<small>'+esc(mm2.r)+'</small>':"")+'</div></div>';});
  else html+='<div class="hint">'+esc(c.off||c.tbd||"没有课")+'</div>';
  if(c.makeup)html+='<div class="hint" style="margin-top:10px">'+esc(c.makeup)+'</div>';
  var evs=(state.events||[]).filter(function(ev){return occAfter(ev,k)===k||ev.date===k;});
  if(evs.length){
    html+='<div class="sep"></div>';
    evs.forEach(function(ev){
      html+='<div class="task" data-done="0"><div class="tbody"><div class="tl">'+esc(ev.title)+
        (ev.repeat==="yearly"?'<span class="opt">每年</span>':"")+'</div></div>'+
        '<button class="del" data-act="evDel" data-id="'+esc(ev.id)+'">删除</button></div>';
    });
  }
  var lun=state.ui.evLunar;
  html+='<div class="sep"></div><div class="stack">'+
    '<input id="evTitle" placeholder="加一条，比如 姥姥生日 / 交剪辑作业">'+
    '<div class="seg" style="grid-template-columns:repeat(2,1fr)">'+
    '<button data-act="evMode" data-m="0" data-on="'+(lun?0:1)+'">公历</button>'+
    '<button data-act="evMode" data-m="1" data-on="'+(lun?1:0)+'">农历</button></div>';
  if(lun){
    html+='<div style="display:flex;gap:8px"><select id="evLM">';
    for(var mi=0;mi<12;mi++)html+='<option value="'+(mi+1)+'"'+(state.ui.evLM==mi+1?" selected":"")+'>'+LMON[mi]+'</option>';
    html+='</select><select id="evLD">';
    for(var di=0;di<30;di++)html+='<option value="'+(di+1)+'"'+(state.ui.evLD==di+1?" selected":"")+'>'+LDAY[di]+'</option>';
    html+='</select></div>'+
      '<div style="display:flex;gap:10px;align-items:center;justify-content:space-between">'+
      '<span class="hint">每年按农历自动换算</span><button class="btn" data-act="evAdd" data-lunar="1">添加</button></div>';
  }else{
    html+='<div style="display:flex;gap:10px;align-items:center;justify-content:space-between">'+
      '<label class="hint" style="display:flex;gap:7px;align-items:center"><input type="checkbox" id="evYear" style="width:17px;height:17px">每年重复</label>'+
      '<button class="btn" data-act="evAdd">加到 '+fmtDate(D)+'</button></div>';
  }
  html+='</div></div>';

  var allEv=(state.events||[]).map(function(ev){var o=occAfter(ev,todayKey());return{ev:ev,occ:o,d:daysBetween(todayKey(),o)};})
    .sort(function(a,b){return a.d-b.d;});
  var evAll=state.ui.evAll,evList=evAll?allEv:allEv.slice(0,5);
  html+='<div class="card"><div class="ctitle"><h2>所有日程</h2><span class="aside">'+allEv.length+' 条</span></div>';
  if(!allEv.length)html+='<div class="hint">还没有。上面挑一天加。</div>';
  html+='<div class="'+(evAll?"scrollist":"")+'">';
  evList.forEach(function(u){
    html+='<div class="task" data-done="0"><div class="tbody"><div class="tl">'+esc(u.ev.title)+'</div>'+
      '<div class="tn">'+(u.ev.lunar?esc(lunarName(u.ev))+' · ':"")+u.occ.replace(/-/g,"/")+
      (u.d>=0?' · '+whenTxt(u.d):"")+'</div></div>'+
      '<button class="del" data-act="evDel" data-id="'+esc(u.ev.id)+'">删除</button></div>';
  });
  html+='</div>';
  if(allEv.length>5)html+='<button class="btn quiet morebtn" data-act="evAll">'+
    (evAll?"收起":"展开全部（"+allEv.length+"）")+'</button>';
  html+='</div>';

  html+='<div class="card"><div class="ctitle"><h2>学期</h2></div><table>'+
    SEMESTERS.map(function(s){return '<tr><td>'+s.name+'</td><td>'+s.start.slice(5).replace("-","/")+' – '+s.end.slice(5).replace("-","/")+'</td></tr>';}).join("")+
    '</table><div class="hint" style="margin-top:10px">春、夏学期的课表还没定，出来以后可以在设置里导出备份、我再帮你改进去。</div></div>';
  return html;
}

/* ---- SETTINGS ---- */
function viewSettings(){
  var F=state.flags,T=state.targets,html="";
  html+='<div class="head"><div class="greet">设置</div><h1 class="date serif">设置</h1></div>';
  html+='<div class="card"><div class="ctitle"><h2>模式</h2></div>'+
    tg("travel","旅行模式","关掉常规目标，只留可选的轻复习。结束后直接恢复，不补。",F.travel)+
    tg("overload","课业高压模式","只留韩语保底、英语维持，德语和阅读电影转可选。",F.overload)+
    tg("sundayDown","周日轻量","周日只做复习、阅读、周回顾和家务。",F.sundayDown)+
    '<div class="tg"><div><div class="tt">旅行日期</div><div class="td">填了自动生效、到期自动结束。单日出门用上面那个开关更快。</div></div></div>'+
    '<div style="display:flex;gap:8px;align-items:center"><input type="date" data-trav="from" value="'+esc(state.travel.from||"")+'">'+
    '<span class="hint">到</span><input type="date" data-trav="to" value="'+esc(state.travel.to||"")+'"></div>'+
    '<div class="tg" style="margin-top:4px"><div><div class="tt">起步期到</div><div class="td">这之前默认 Minimum，不提完成率。</div></div>'+
    '<input type="date" data-ramp="1" value="'+esc(state.ramp||"")+'" style="width:158px"></div>'+
    '</div>';
  html+='<div class="card"><div class="ctitle"><h2>目标</h2><span class="aside">可以自己调</span></div>'+
    num("krWeek","每周韩语课",T.krWeek)+num("enDays","每周英语天数",T.enDays)+num("deDays","每周德语天数",T.deDays)+
    num("readMin","每周阅读（分钟）",T.readMin)+num("movies","每周电影",T.movies)+num("vocabDay","每天词汇量",T.vocabDay)+
    '</div>';
  html+='<div class="card"><div class="ctitle"><h2>备份</h2></div>'+
    '<div class="btns"><button class="btn solid" data-act="export">导出 JSON</button>'+
    '<button class="btn" data-act="showJson">显示 JSON</button>'+
    '<button class="btn" data-act="import">导入 JSON</button></div>'+
    '<div id="jsonBox"></div>'+
    '<div class="hint" style="margin-top:12px">iPad 上「导出」会存到「文件」。想换设备就把那个文件用「导入」读回来。定期导一次，数据只存在这台设备的浏览器里。</div>'+
    '<div class="sep"></div><div class="btns"><button class="btn" data-act="reset" style="color:#B3261E;border-color:#B3261E">清空全部数据</button></div>'+
    '<div class="hint" style="margin-top:8px">会问你两次。清空之后无法恢复，先导出。</div></div>';
  html+='<div class="card flat"><div class="hint">学习强度：Minimum 约 30 分钟核心学习；Standard 约 1.5–2 小时课外学习；High 约 2.5–4 小时。这些是区间，不是必须达到的数字。<br><br>语言优先级：韩语 &gt; 英语 &gt; 德语。重课日只主推一门，不要求三门每天都学。<br><br>通勤只听音乐，不算语言学习。</div></div>';
  html+='<div class="card flat"><div class="hint">数据存在这台设备的浏览器里（localStorage）。'+(Store.ok?"当前环境可以保存。":"当前环境不能保存，见页面顶部提示。")+'</div></div>';
  return html;
}
function tg(id,t,d,on){return '<div class="tg"><div><div class="tt">'+t+'</div><div class="td">'+d+'</div></div>'+
  '<button class="sw" data-act="flag" data-id="'+id+'" data-on="'+(on?1:0)+'" role="switch" aria-checked="'+(!!on)+'" aria-label="'+t+'"></button></div>';}
function num(id,label,v){return '<div class="tg"><div class="tt">'+label+'</div>'+
  '<input style="width:88px;text-align:right" type="number" inputmode="numeric" data-target="'+id+'" value="'+v+'"></div>';}

/* ---------- render ---------- */
var lastDay=todayKey();
function render(){
  lastDay=todayKey();
  renderNav();
  var t=state.ui.tab;
  view.innerHTML=t==="today"?viewToday():t==="week"?viewWeek():t==="progress"?viewProgress():t==="calendar"?viewCalendar():viewSettings();
  if(!Store.ok)document.getElementById("storeWarn").innerHTML=
    '<div class="notice">这个环境不能保存数据（多半是预览窗口）。把 index.html 下载下来，用 Safari 或 Chrome 打开，进度才会留住。</div>';
  save();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-tab]");
  if(b){state.ui.tab=b.getAttribute("data-tab");state.ui.edit=false;window.scrollTo(0,0);render();return;}
  var a=e.target.closest("[data-act]");if(!a)return;
  var act=a.getAttribute("data-act"),k=state.ui.date,d;
  switch(act){
    case "mode": d=day(k);d.mode=a.getAttribute("data-mode");syncTasks(k);save();render();break;
    case "task": toggleTask(k,a.getAttribute("data-id"));break;
    case "edit": state.ui.edit=!state.ui.edit;render();break;
    case "delTask": d=day(k);d.tasks=d.tasks.filter(function(t){return t.id!==a.getAttribute("data-id");});save();render();break;
    case "addTask": {
      var inp=document.getElementById("newTask"),val=inp?inp.value.trim():"";
      if(!val)return;d=day(k);d.tasks.push({id:"c"+Date.now(),g:"Other",l:val,done:false,custom:true,o:true});save();render();break;}
    case "vocab": {d=day(k);var n=a.getAttribute("data-n");
      d.vocab=n==="reset"?0:(d.vocab||0)+ +n;
      if((d.vocab||0)>=Math.min(25,state.targets.vocabDay))markDone(d,"en_vocab",true);
      save();render();break;}
    case "read": {d=day(k);var r=a.getAttribute("data-n");
      d.reading=r==="reset"?0:(d.reading||0)+ +r;
      if((d.reading||0)>0)markDone(d,"read",true);save();render();break;}
    case "movie": {var mi=document.getElementById("movieName"),title=mi?mi.value.trim():"";
      if(!title)return;d=day(k);d.movie=title;
      state.movies=state.movies.filter(function(m){return m.date!==k;});
      state.movies.push({date:k,title:title});markDone(d,"movie",true);save();render();break;}
    case "goToday": state.ui.date=todayKey();render();break;
    case "openDay": state.ui.date=a.getAttribute("data-k");
      if(state.ui.tab==="week"){state.ui.tab="today";window.scrollTo(0,0);}render();break;
    case "openDayTab": state.ui.date=a.getAttribute("data-k");state.ui.tab="today";window.scrollTo(0,0);render();break;
    case "week": {var w=+a.getAttribute("data-n");
      state.ui.date=w===0?todayKey():dk(addDays(pd(state.ui.date),w*7));render();break;}
    case "mon": {var mm=+a.getAttribute("data-n"),cur=state.ui.calMonth||state.ui.date.slice(0,7);
      if(mm===0)state.ui.calMonth=todayKey().slice(0,7);
      else{var yy=+cur.slice(0,4),mo=+cur.slice(5,7)+mm;var dd2=new Date(yy,mo-1,1);state.ui.calMonth=dk(dd2).slice(0,7);}
      render();break;}
    case "level": state.ui.level=state.ui.level===a.getAttribute("data-id")?null:a.getAttribute("data-id");render();break;
    case "lesson": {var lid=a.getAttribute("data-id"),ln=+a.getAttribute("data-n");
      state.korean[lid]=state.korean[lid]===ln?ln-1:ln;save();render();break;}
    case "krAdj": {var id2=a.getAttribute("data-id"),L=LEVELS.filter(function(x){return x.id===id2;})[0];
      state.korean[id2]=Math.max(0,Math.min(L.total,state.korean[id2]+ +a.getAttribute("data-n")));save();render();break;}
    case "cov": state.vocabCovered=Math.max(0,Math.min(5520,state.vocabCovered+ +a.getAttribute("data-n")));save();render();break;
    case "flag": {var f=a.getAttribute("data-id");state.flags[f]=!state.flags[f];
      var td2=day(todayKey());td2.mode=defaultMode(todayKey());syncTasks(todayKey());save();render();break;}
    case "hwTog": {var hid=a.getAttribute("data-id");
      (state.hw||[]).forEach(function(x){if(x.id===hid)x.done=!x.done;});save();render();break;}
    case "hwDel": {var hd=a.getAttribute("data-id");
      state.hw=(state.hw||[]).filter(function(x){return x.id!==hd;});save();render();break;}
    case "hwAdd": {
      var ti=document.getElementById("hwTitle"),co=document.getElementById("hwCourse"),du=document.getElementById("hwDue");
      var tv2=ti?ti.value.trim():"";if(!tv2)return;
      state.hw=state.hw||[];
      state.hw.push({id:"h"+Date.now(),title:tv2,course:co?co.value.trim():"",due:du&&du.value?du.value:"",done:false});
      save();render();break;}
    case "hwClear": state.hw=(state.hw||[]).filter(function(x){return !x.done;});save();render();break;
    case "demo": state.demo=+a.getAttribute("data-n");save();render();break;
    case "evAll": state.ui.evAll=!state.ui.evAll;render();break;
    case "hwAll": state.ui.hwAll=!state.ui.hwAll;render();break;
    case "evMode": state.ui.evLunar=a.getAttribute("data-m")==="1";render();break;
    case "evAdd": {
      var et=document.getElementById("evTitle");
      var evv=et?et.value.trim():"";if(!evv)return;
      state.events=state.events||[];
      if(a.getAttribute("data-lunar")){
        var lm=document.getElementById("evLM"),ld=document.getElementById("evLD");
        var lmv=lm?+lm.value:1,ldv=ld?+ld.value:1;
        state.ui.evLM=lmv;state.ui.evLD=ldv;
        state.events.push({id:"v"+Date.now(),title:evv,type:"other",repeat:"yearly",
          lunar:{m:lmv,d:ldv},date:lunarNext(lmv,ldv,todayKey())||todayKey()});
      }else{
        var ey=document.getElementById("evYear");
        state.events.push({id:"v"+Date.now(),date:state.ui.date,title:evv,type:"other",repeat:ey&&ey.checked?"yearly":null});
      }
      save();render();break;}
    case "evDel": {var vd=a.getAttribute("data-id");
      state.events=(state.events||[]).filter(function(x){return x.id!==vd;});
      state.killed=state.killed||[];
      if(state.killed.indexOf(vd)<0)state.killed.push(vd);
      save();render();break;}
    case "export": doExport();break;
    case "showJson": {var box=document.getElementById("jsonBox");
      box.innerHTML=box.innerHTML?"":'<textarea rows="6" style="margin-top:12px" readonly>'+esc(JSON.stringify(state))+'</textarea><div class="hint">长按全选复制，存到备忘录里也行。</div>';break;}
    case "import": document.getElementById("importFile").click();break;
    case "reset": {
      if(!confirm("清空所有数据？先导出一份备份。"))return;
      if(!confirm("真的清空？这一步无法撤销。"))return;
      Store.del(KEY);state=JSON.parse(JSON.stringify(DEFAULT));state.ui.date=todayKey();save();render();break;}
  }
});
function markDone(d,id,val){d.tasks.forEach(function(t){if(t.id===id)t.done=val;});}

document.addEventListener("input",function(e){
  var j=e.target.getAttribute&&e.target.getAttribute("data-j");
  if(j){var d=day(state.ui.date);d.journal[j]=e.target.value;save();return;}
  var rv2=e.target.getAttribute&&e.target.getAttribute("data-rev");
  if(rv2){var wk=e.target.getAttribute("data-wk");state.reviews=state.reviews||{};
    state.reviews[wk]=state.reviews[wk]||{};state.reviews[wk][rv2]=e.target.value;save();return;}
  var tv3=e.target.getAttribute&&e.target.getAttribute("data-trav");
  if(tv3){state.travel[tv3]=e.target.value;save();return;}
  if(e.target.getAttribute&&e.target.getAttribute("data-ramp")){state.ramp=e.target.value;save();return;}
  if(e.target.getAttribute&&e.target.getAttribute("data-cov")){
    var cv=parseInt(e.target.value,10);if(!isNaN(cv)&&cv>=0)state.vocabCovered=Math.min(5520,cv);save();return;}
  var tg2=e.target.getAttribute&&e.target.getAttribute("data-target");
  if(tg2){var v=parseInt(e.target.value,10);if(!isNaN(v)&&v>=0)state.targets[tg2]=v;save();return;}
});
document.getElementById("importFile").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var obj=JSON.parse(r.result);
      if(!obj||typeof obj!=="object")throw 0;
      state=merge(JSON.parse(JSON.stringify(DEFAULT)),obj);
      state.ui.date=todayKey();state.ui.tab="today";save();render();
      alert("导入完成。");
    }catch(err){alert("这个文件读不出来，换一个导出的 JSON 试试。");}
  };
  r.readAsText(f);e.target.value="";
});
function doExport(){
  var data=JSON.stringify(state,null,2);
  try{
    var blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="study-desk-"+todayKey()+".json";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},500);
  }catch(e){
    var box=document.getElementById("jsonBox");
    if(box)box.innerHTML='<textarea rows="8" style="margin-top:12px" readonly>'+esc(data)+'</textarea>';
  }
}

/* ---------- init ---------- */
(function init(){
  state.ui.date=state.ui.date||todayKey();
  state.killed=state.killed||[];
  state.events=state.events||[];ensureSeeds();
  state.notes=state.notes||[];state.reviews=state.reviews||{};
  if(!state.days[todayKey()])day(todayKey());
  day(state.ui.date);
  render();
  function rollover(){
    var t=todayKey();
    if(t===lastDay)return;
    if(state.ui.date===lastDay)state.ui.date=t;
    day(t);render();
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)rollover();});
  setInterval(function(){if(!document.hidden)rollover();},60000);
  window.addEventListener("beforeunload",function(){Store.set(KEY,JSON.stringify(state));});
  /* 离线可用：把自己缓存下来（file:// 下会静默跳过） */
  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
    try{
      var sw="self.addEventListener('install',function(e){self.skipWaiting()});"+
             "self.addEventListener('fetch',function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request)}))});";
      var u=URL.createObjectURL(new Blob([sw],{type:"text/javascript"}));
      navigator.serviceWorker.register(u).catch(function(){});
    }catch(e){}
  }
})();
</script>
